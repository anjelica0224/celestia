name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios-eas:
    name: Kick off iOS EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start iOS build (no wait)
        run: eas build --platform ios --profile preview --non-interactive --no-wait

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Generate Android folder
        run: npx expo prebuild --platform android --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: celestia-android
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios-eas]
    if: always() && needs.android.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: celestia-android
          path: artifacts/android

      - name: Rename APK
        run: mv artifacts/android/app-release.apk artifacts/celestia-${{ steps.sha.outputs.short }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: Celestia ${{ steps.sha.outputs.short }}
          body: |
            ## Celestia ${{ steps.sha.outputs.short }}
            Built from [`${{ steps.sha.outputs.short }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on `main`.

            ### Android
            Download the `.apk` below and install directly.

            ### iOS
            iOS build is queued on EAS. Check the [Expo dashboard](https://expo.dev) for the `.ipa` / simulator build once it completes.
          draft: false
          prerelease: false
          files: artifacts/celestia-*.apk