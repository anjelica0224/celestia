name: EAS Build (Android & iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        if: inputs.platform == 'all' || inputs.platform == 'android' || github.event_name == 'push'
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive

      - name: Build iOS
        if: inputs.platform == 'all' || inputs.platform == 'ios' || github.event_name == 'push'
        run: eas build --platform ios --profile ${{ inputs.profile || 'preview' }} --non-interactive
